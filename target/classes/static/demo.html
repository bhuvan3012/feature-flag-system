<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awesome Store - Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            color: #1f2937;
        }
        .header {
            background-color: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #e5e7eb;
            padding: 15px 0;
        }
        .total {
            font-size: 20px;
            font-weight: bold;
            text-align: right;
            margin-top: 20px;
        }
        
        /* The dynamic button area */
        #checkout-container {
            margin-top: 30px;
            text-align: center;
        }
        
        /* Old Boring Button */
        .btn-old {
            background-color: #9ca3af;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        
        /* New Shiny Button (Feature Flagged) */
        .btn-new {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            padding: 16px 32px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
            transition: transform 0.2s;
        }
        .btn-new:hover {
            transform: translateY(-2px);
        }
        
        .loading {
            color: #6b7280;
            font-style: italic;
        }
        .user-simulator {
            margin-bottom: 20px;
            padding: 15px;
            background: #e0e7ff;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛍️ Awesome E-Commerce Store</h1>
    </div>

    <div class="container">
        <div class="user-simulator">
            <strong>Simulated User Environment:</strong>
            <p>User ID: <code id="display-user">user_123</code></p>
            <p>Environment: <code>PROD</code></p>
            <button onclick="changeUser()">Simulate Different User</button>
        </div>
    
        <h2>Your Shopping Cart</h2>
        <div class="item">
            <span>Wireless Headphones</span>
            <span>$99.00</span>
        </div>
        <div class="item">
            <span>Mechanical Keyboard</span>
            <span>$149.00</span>
        </div>
        <div class="total">
            Total: $248.00
        </div>

        <div id="checkout-container">
            <span class="loading">Evaluating Feature Flags...</span>
        </div>
    </div>

    <script>
        // Simulated User context
        let currentUserId = "user_123";

        function changeUser() {
            currentUserId = "user_" + Math.floor(Math.random() * 10000);
            document.getElementById("display-user").innerText = currentUserId;
            evaluateFlags();
        }

        async function evaluateFlags() {
            const container = document.getElementById("checkout-container");
            container.innerHTML = '<span class="loading">Contacting Feature Flag Server...</span>';

            try {
                // THIS is where the magic happens!
                // The client app asks your Spring Boot backend: "Is the new checkout flow enabled for this user?"
                const response = await fetch('/api/v1/evaluate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        flagName: 'new-checkout-flow',
                        userId: currentUserId,
                        environment: 'PROD'
                    })
                });

                const data = await response.json();
                
                // Read the boolean result from the evaluation
                if (data.enabled === true) {
                    // Feature is ON -> Show the New Checkout Flow
                    container.innerHTML = `
                        <button class="btn-new" onclick="alert('Proceeding with NEW shiny checkout flow!')">
                            ✨ Proceed to Checkout V2 ✨
                        </button>
                        <p style="color: #10b981; font-size: 12px; margin-top: 10px;">
                            (Feature Flag evaluated to TRUE: ${data.reason})
                        </p>
                    `;
                } else {
                    // Feature is OFF -> Show the Old Checkout Flow
                    container.innerHTML = `
                        <button class="btn-old" onclick="alert('Proceeding with old checkout flow.')">
                            Checkout
                        </button>
                        <p style="color: #ef4444; font-size: 12px; margin-top: 10px;">
                            (Feature Flag evaluated to FALSE: ${data.reason})
                        </p>
                    `;
                }
            } catch (error) {
                container.innerHTML = `<span style="color: red;">Failed to contact Feature Flag Server.</span>`;
                console.error(error);
            }
        }

        // Run evaluation on page load
        evaluateFlags();
    </script>
</body>
</html>
