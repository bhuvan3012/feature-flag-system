server.port=8081

# 💾 H2 Database Configuration (Default for seamless zero-config running & testing)
spring.datasource.url=jdbc:h2:mem:feature_flags_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Accessible at http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 🐬 MySQL Configuration (Uncomment for Production MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/feature_flags_db
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=bhuvan@7777

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.cache.type=simple

# 📖 OpenAPI / Swagger documentation path
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
